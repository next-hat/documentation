ApiVersion: $NANOCL_VERSION

Namespace: global

# See all options:
# https://docs.next-hat.com/references/nanocl/objects/resource
Resources:
- Name: myvm.ssh
  Kind: ncproxy.io/rule/$NCPROXY_VERSION
  Data:
    Rules:
    - Protocol: Tcp
      Network: Public
      Port: 5555
      Target:
        Key: global.myvm.v
        Port: 22

# See all options:
# https://docs.next-hat.com/references/nanocl/objects/virtual-machine
VirtualMachines:
- Name: myvm
  Image: /var/lib/nanocl/vm/myvm.qcow2
  HostConfig:
    Cpu: 2
    Memory: 2048
