ApiVersion: $NANOCL_VERSION

# Definition of your arguments
# The type of argument, can be:
# - String
# - Number
# - Boolean
Args:
- Name: name
  Kind: String
- Name: domain
  Kind: String
- Name: image
  Kind: String
- Name: port
  Kind: String

Namespace: global

Cargoes:
- Name: ${{ Args.name }}
  Containers:
  - Name: app
    Image: ${{ Args.image }}

Resources:
- Name: ${{ Args.domain }}
  Kind: ncproxy.io/rule/$NCPROXY_VERSION
  Data:
    Rules:
    - Domain: ${{ Args.domain }}
      Network: Public
      Locations:
      - Path: /
        Target:
          Key: global.${{ Args.name }}.c
          Port: ${{ Args.port }}
