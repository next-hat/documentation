ApiVersion: $NANOCL_VERSION

Namespace: global

# See all options:
# https://docs.next-hat.com/references/nanocl/objects/secret
Secrets:
- Name: env.my-secret
  Kind: nanocl.io/env
  Data:
  - MY_ENV=MY_VALUE
  - MY_ENV1=MY_VALUE1

# See all options:
# https://docs.next-hat.com/references/nanocl/objects/cargo
Cargoes:
- Name: my-cargo
  Containers:
  - Name: web
    # Container-scoped secrets are injected only into this container.
    Secrets:
    - env.my-secret
    Image: ghcr.io/next-hat/nanocl-get-started:latest

# See all options:
# https://docs.next-hat.com/references/nanocl/objects/resource
Resources:
- Name: deploy-example.com
  Kind: ncproxy.io/rule/$NCPROXY_VERSION
  Data:
    Rules:
    - Domain: deploy-example.com
      Network: Public
      Locations:
      - Path: /
        Target:
          Key: global.my-cargo.c
          Port: 9000
